<!doctype html>
<!-- Three first-session onboarding journeys, switchable via ?variant=A|B|C, in one throwaway Science Storyboard prototype. -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>One Fact Changed — First-session prototype</title>
  <style>
    :root {
      --ink: #17191f;
      --muted: #686b73;
      --paper: #f5f0e6;
      --card: #fffef9;
      --coral: #f04e3e;
      --teal: #24a7a1;
      --yellow: #fff0a7;
      --mint: #bcebe3;
      --pink: #ffd0c7;
      --white: #fffef9;
      --shadow: 7px 7px 0 var(--ink);
    }

    * { box-sizing: border-box; }
    html { color-scheme: light; }
    body {
      margin: 0;
      min-width: 320px;
      min-height: 100vh;
      color: var(--ink);
      background: var(--paper);
      font-family: Arial, Helvetica, sans-serif;
      line-height: 1.4;
    }
    button, input, textarea { font: inherit; }
    button { color: inherit; }
    button, label { -webkit-tap-highlight-color: transparent; }
    button:focus-visible, input:focus-visible, textarea:focus-visible {
      outline: 4px solid var(--teal);
      outline-offset: 3px;
    }
    h1, h2, h3, p { margin-top: 0; }
    h1, h2, h3, .heavy {
      font-family: "Arial Black", Arial, Helvetica, sans-serif;
      letter-spacing: -.055em;
      line-height: .96;
    }
    p { max-width: 68ch; }
    input, textarea {
      width: 100%;
      border: 3px solid var(--ink);
      border-radius: 0;
      color: var(--ink);
      background: var(--white);
    }
    input { min-height: 48px; padding: 10px 12px; }
    textarea { min-height: 78px; padding: 11px 12px; resize: vertical; }
    input::placeholder, textarea::placeholder { color: #777982; opacity: 1; }

    .shell { width: min(1180px, calc(100% - 34px)); margin: 0 auto; padding-bottom: 120px; }
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      min-height: 72px;
      border-bottom: 3px solid var(--ink);
    }
    .brand { display: flex; align-items: center; gap: 10px; font-weight: 1000; letter-spacing: -.04em; }
    .brand-mark { display: inline-grid; place-items: center; width: 22px; height: 22px; background: var(--coral); transform: rotate(-7deg); }
    .prototype-flag { padding: 7px 10px; color: var(--white); background: var(--ink); font-size: 11px; font-weight: 900; letter-spacing: .04em; }
    .stage-line { display: flex; align-items: center; flex-wrap: wrap; gap: 7px; margin: 20px 0; }
    .stage-chip { padding: 6px 9px; border: 2px solid var(--ink); background: var(--white); font-size: 11px; font-weight: 900; }
    .stage-chip.done { background: var(--mint); }
    .stage-chip.current { color: var(--white); background: var(--ink); }
    .stage-arrow { font-weight: 1000; }
    .kicker { margin-bottom: 10px; color: var(--coral); font-size: 13px; font-weight: 1000; }
    .hero-title { max-width: 880px; margin: 34px 0 16px; font-size: clamp(48px, 8vw, 108px); }
    .hero-copy { max-width: 620px; color: var(--muted); font-size: 17px; }
    .button-row { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin-top: 22px; }
    .button {
      min-height: 48px;
      padding: 10px 17px;
      border: 3px solid var(--ink);
      border-radius: 0;
      background: var(--white);
      box-shadow: 4px 4px 0 var(--ink);
      cursor: pointer;
      font-weight: 1000;
    }
    .button:hover { transform: translate(-1px, -1px); box-shadow: 6px 6px 0 var(--ink); }
    .button.primary { color: var(--white); background: var(--coral); }
    .button.teal { background: var(--teal); }
    .button.small { min-height: 38px; padding: 6px 11px; border-width: 2px; box-shadow: 3px 3px 0 var(--ink); font-size: 12px; }
    .text-button { padding: 8px 2px; border: 0; background: transparent; cursor: pointer; text-decoration: underline; font-weight: 900; }
    .panel {
      border: 3px solid var(--ink);
      background: var(--card);
      box-shadow: var(--shadow);
    }
    .panel-pad { padding: clamp(18px, 3vw, 34px); }
    .panel-number { display: block; margin-bottom: 24px; color: var(--coral); font: 1000 11px ui-monospace, SFMono-Regular, Menlo, monospace; }
    .mini-note { color: var(--muted); font-size: 12px; }
    .callout { padding: 13px 15px; border-left: 7px solid var(--coral); background: var(--yellow); font-size: 13px; }
    .error { margin: 14px 0 0; padding: 10px 12px; border: 3px solid var(--coral); background: #fff4f0; font-weight: 800; }
    .success { border-color: var(--teal); background: var(--mint); }
    .field { display: grid; gap: 6px; }
    .field > span:first-child { font-size: 13px; font-weight: 1000; }
    .field-hint { color: var(--muted); font-size: 11px; }
    .form-grid { display: grid; gap: 15px; }
    .form-grid.two { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .checks { display: grid; gap: 10px; }
    .check { display: grid; grid-template-columns: 23px 1fr; gap: 9px; align-items: start; font-size: 13px; }
    .check input { width: 20px; min-height: 20px; margin: 1px 0 0; accent-color: var(--ink); }
    .account-form { display: grid; gap: 18px; }
    .permanent { padding: 13px; border: 3px solid var(--ink); background: var(--pink); }
    .premise-card { padding: 24px; border: 3px solid var(--ink); background: var(--yellow); box-shadow: var(--shadow); }
    .premise-card h2 { max-width: 720px; margin-bottom: 0; font-size: clamp(30px, 5vw, 62px); }
    .deadline { display: inline-block; margin-bottom: 14px; padding: 5px 8px; border: 2px solid var(--ink); background: var(--white); font-size: 11px; font-weight: 1000; }
    .response-form { display: grid; gap: 14px; }
    .answer-field textarea { min-height: 92px; border-width: 4px; font-size: 20px; font-weight: 800; }
    .steps { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 11px; }
    .step-card { padding: 12px; border: 3px solid var(--ink); background: var(--white); }
    .step-card:nth-child(1) { background: var(--yellow); }
    .step-card:nth-child(2) { background: var(--mint); }
    .step-card:nth-child(3) { background: var(--pink); }
    .step-card textarea { min-height: 116px; border-width: 2px; background: rgba(255,255,255,.72); }
    .chain-preview { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 7px; align-items: stretch; }
    .chain-node { position: relative; min-height: 145px; padding: 13px; border: 3px solid var(--ink); background: var(--white); overflow-wrap: anywhere; }
    .chain-node:nth-child(2) { background: var(--yellow); }
    .chain-node:nth-child(3) { background: var(--mint); }
    .chain-node:nth-child(4) { background: var(--pink); }
    .chain-node:nth-child(5) { color: var(--white); background: var(--teal); }
    .chain-node:not(:last-child)::after { content: "→"; position: absolute; z-index: 2; right: -17px; top: 52px; font-size: 23px; font-weight: 1000; }
    .chain-label { display: block; margin-bottom: 18px; color: var(--muted); font-size: 10px; font-weight: 1000; }
    .chain-node:last-child .chain-label { color: #173c3a; }

    /* Variant A: a taught, registration-first linear strip. */
    .a-intro-strip { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin: 34px 0 26px; }
    .a-intro-panel { min-height: 180px; padding: 15px; border: 3px solid var(--ink); background: var(--white); box-shadow: 5px 5px 0 var(--ink); }
    .a-intro-panel:nth-child(2) { background: var(--yellow); transform: translateY(8px); }
    .a-intro-panel:nth-child(3) { background: var(--mint); transform: translateY(-3px); }
    .a-intro-panel:nth-child(4) { background: var(--pink); transform: translateY(6px); }
    .a-intro-panel:nth-child(5) { color: var(--white); background: var(--teal); transform: translateY(-5px); }
    .a-intro-panel:nth-child(5) .mini-note { color: #173c3a; }
    .a-intro-panel strong { display: block; margin-top: 34px; font-size: 17px; line-height: 1.05; }
    .a-grid { display: grid; grid-template-columns: minmax(0, 1.55fr) minmax(250px, .7fr); gap: 22px; align-items: start; margin-top: 32px; }
    .a-aside { position: sticky; top: 18px; padding: 20px; border: 3px solid var(--ink); background: var(--teal); box-shadow: var(--shadow); }
    .a-aside h3 { font-size: 25px; }
    .a-aside ol { padding-left: 20px; font-size: 13px; }

    /* Variant B: cold-open workspace with account gate after the draft. */
    .b-shell { width: min(1280px, calc(100% - 28px)); }
    .b-header-note { color: var(--muted); font-size: 12px; font-weight: 800; }
    .b-workspace { display: grid; grid-template-columns: minmax(230px, .65fr) minmax(0, 1.6fr); gap: 0; margin-top: 26px; border: 4px solid var(--ink); box-shadow: 10px 10px 0 var(--ink); }
    .b-premise { padding: 24px; border-right: 4px solid var(--ink); background: var(--yellow); }
    .b-premise h1 { margin-top: 54px; font-size: clamp(34px, 5vw, 68px); }
    .b-draft { padding: 24px; background: var(--white); }
    .b-draft-head { display: flex; justify-content: space-between; gap: 15px; align-items: start; }
    .b-draft-head h2 { font-size: 34px; }
    .b-inline-chain { display: grid; grid-template-columns: 1fr 42px; gap: 12px; }
    .b-step-stack { display: grid; gap: 8px; }
    .b-step-row { display: grid; grid-template-columns: 44px 1fr; border: 3px solid var(--ink); background: var(--mint); }
    .b-step-row:nth-child(2) { background: var(--pink); }
    .b-step-row:nth-child(3) { background: var(--yellow); }
    .b-step-num { display: grid; place-items: center; border-right: 3px solid var(--ink); font-size: 24px; font-weight: 1000; }
    .b-step-row textarea { min-height: 72px; border: 0; background: transparent; }
    .b-arrow-column { display: grid; place-items: center; color: var(--coral); font-size: 42px; font-weight: 1000; }
    .b-gate { display: grid; grid-template-columns: minmax(0, 1fr) minmax(280px, .72fr); gap: 22px; margin-top: 30px; }
    .b-gate-copy { padding: 32px; color: var(--white); background: var(--ink); }
    .b-gate-copy h1 { font-size: clamp(42px, 7vw, 84px); }
    .b-board-stage { position: relative; display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(320px, .8fr); gap: 14px; margin-top: 26px; }
    .b-board-muted { opacity: .42; filter: grayscale(.4); pointer-events: none; }
    .b-ballot-float { position: relative; z-index: 2; border: 4px solid var(--ink); background: var(--white); box-shadow: 9px 9px 0 var(--ink); }

    /* Variant C: the live board is the doorway and never disappears. */
    .c-topbar { border-bottom-color: var(--teal); }
    .c-board { margin-top: 24px; border: 4px solid var(--ink); background: var(--teal); box-shadow: 9px 9px 0 var(--ink); }
    .c-board-head { display: flex; justify-content: space-between; gap: 15px; padding: 22px; border-bottom: 4px solid var(--ink); }
    .c-board-head h1 { margin-bottom: 0; font-size: clamp(40px, 7vw, 84px); }
    .c-board-head .mini-note { color: #173c3a; }
    .c-rounds { display: grid; grid-template-columns: 1.2fr .9fr .9fr; }
    .c-round { min-height: 290px; padding: 20px; border-right: 3px solid var(--ink); background: var(--white); }
    .c-round:last-child { border-right: 0; }
    .c-round.featured { background: var(--yellow); }
    .c-round h2 { margin-top: 50px; font-size: clamp(25px, 3vw, 42px); }
    .c-stats { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 18px; }
    .stat { padding: 5px 7px; border: 2px solid var(--ink); background: var(--white); font-size: 11px; font-weight: 900; }
    .c-flow { display: grid; grid-template-columns: 210px minmax(0, 1fr); gap: 20px; margin-top: 28px; }
    .c-rail { align-self: start; border: 3px solid var(--ink); background: var(--teal); box-shadow: var(--shadow); }
    .c-rail-item { padding: 14px; border-bottom: 2px solid var(--ink); font-size: 12px; font-weight: 900; }
    .c-rail-item:last-child { border-bottom: 0; }
    .c-rail-item.active { background: var(--yellow); }
    .c-main { min-width: 0; }

    .ballot { display: grid; gap: 0; }
    .peer-response { padding: clamp(18px, 3vw, 30px); border-bottom: 3px solid var(--ink); background: var(--yellow); }
    .peer-response h2 { font-size: clamp(28px, 4vw, 52px); }
    .peer-chain { display: grid; gap: 7px; margin-top: 18px; }
    .peer-step { padding: 10px 12px; border: 2px solid var(--ink); background: rgba(255,255,255,.72); font-size: 13px; }
    .ratings { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .rating { padding: 20px; border-right: 3px solid var(--ink); }
    .rating:last-child { border-right: 0; }
    .rating h3 { font-size: 25px; }
    .rating p { color: var(--muted); font-size: 12px; }
    .rating-options { display: flex; flex-wrap: wrap; gap: 7px; }
    .rate {
      min-height: 42px;
      padding: 7px 12px;
      border: 2px solid var(--ink);
      background: var(--white);
      cursor: pointer;
      font-weight: 900;
    }
    .rate.selected { background: var(--teal); box-shadow: 3px 3px 0 var(--ink); }
    .ballot-footer { padding: 18px 20px; border-top: 3px solid var(--ink); background: var(--white); }

    .board-mini { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
    .board-card { min-height: 190px; padding: 16px; border: 3px solid var(--ink); background: var(--white); }
    .board-card:nth-child(2) { background: var(--mint); }
    .board-card:nth-child(3) { background: var(--pink); }
    .board-card strong { display: block; margin: 35px 0 8px; font-size: 20px; line-height: 1.05; }
    .result-list { margin: 20px 0 0; border: 3px solid var(--ink); background: var(--white); }
    .result-row { display: grid; grid-template-columns: 38px minmax(0,1fr) auto; gap: 10px; padding: 12px 14px; border-bottom: 2px solid var(--ink); }
    .result-row:last-child { border-bottom: 0; }
    .result-row.you { background: var(--yellow); }

    .switcher {
      position: fixed;
      z-index: 30;
      left: 50%;
      bottom: 18px;
      display: grid;
      grid-template-columns: 44px minmax(180px, auto) 44px;
      align-items: center;
      overflow: hidden;
      border: 3px solid var(--white);
      border-radius: 999px;
      color: var(--white);
      background: var(--ink);
      box-shadow: 0 8px 24px rgba(0,0,0,.28);
      pointer-events: none;
      transform: translateX(-50%);
    }
    .switcher button { height: 44px; border: 0; color: var(--white); background: transparent; cursor: pointer; pointer-events: auto; font-size: 18px; font-weight: 1000; }
    .switcher button:hover { background: #333640; }
    .switcher-label { padding: 0 10px; text-align: center; font-size: 12px; font-weight: 900; }
    .state-readout {
      position: fixed;
      z-index: 29;
      left: 14px;
      bottom: 14px;
      max-width: 330px;
      pointer-events: none;
      padding: 9px 11px;
      border: 2px solid var(--white);
      color: #d8dbe4;
      background: var(--ink);
      font: 10px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace;
      box-shadow: 0 7px 20px rgba(0,0,0,.2);
    }

    @media (max-width: 860px) {
      .a-intro-strip, .chain-preview { grid-template-columns: 1fr; }
      .a-intro-panel { min-height: auto; transform: none !important; }
      .a-intro-panel strong { margin-top: 14px; }
      .chain-node { min-height: 100px; }
      .chain-node:not(:last-child)::after { content: "↓"; right: 18px; top: auto; bottom: -22px; }
      .a-grid, .b-workspace, .b-gate, .b-board-stage, .c-flow { grid-template-columns: 1fr; }
      .a-aside { position: static; }
      .b-premise { border-right: 0; border-bottom: 4px solid var(--ink); }
      .b-premise h1 { margin-top: 18px; }
      .c-rounds, .board-mini { grid-template-columns: 1fr; }
      .c-round { min-height: 210px; border-right: 0; border-bottom: 3px solid var(--ink); }
      .c-round:last-child { border-bottom: 0; }
      .c-round h2 { margin-top: 24px; }
      .c-rail { display: flex; overflow-x: auto; }
      .c-rail-item { flex: 0 0 auto; border-right: 2px solid var(--ink); border-bottom: 0; }
      .steps { grid-template-columns: 1fr; }
      .form-grid.two, .ratings { grid-template-columns: 1fr; }
      .rating { border-right: 0; border-bottom: 3px solid var(--ink); }
      .rating:last-child { border-bottom: 0; }
    }
    @media (max-width: 620px) {
      .shell { width: min(100% - 22px, 1180px); }
      .topbar { align-items: flex-start; padding: 14px 0; }
      .prototype-flag { max-width: 130px; text-align: center; }
      .hero-title { font-size: 48px; }
      .b-inline-chain { grid-template-columns: 1fr; }
      .b-arrow-column { display: none; }
      .state-readout { display: none; }
      .switcher { bottom: 10px; grid-template-columns: 42px minmax(155px, auto) 42px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <main id="app"></main>
  <div class="state-readout" id="state-readout" aria-live="polite"></div>
  <nav class="switcher" aria-label="Prototype variants">
    <button type="button" data-variant-step="-1" aria-label="Previous onboarding variant">←</button>
    <span class="switcher-label" id="switcher-label"></span>
    <button type="button" data-variant-step="1" aria-label="Next onboarding variant">→</button>
  </nav>

  <script>
    const variants = [
      { key: 'A', name: 'Guided strip' },
      { key: 'B', name: 'Cold open' },
      { key: 'C', name: 'Board doorway' }
    ];
    const example = {
      premise: 'What if humans only needed two hours of sleep?',
      answer: 'Cities would split into quiet and loud time zones on the same streets.',
      steps: [
        'Most people gain six waking hours every day.',
        'Work, errands, and leisure spread across the full night.',
        'Neighborhoods negotiate protected quiet hours block by block.'
      ]
    };
    const peer = {
      author: 'Mira Chen',
      answer: 'Breakfast would become the day’s main social event.',
      steps: [
        'Two hours of sleep makes morning start at a different time for everyone.',
        'Dinner stops being the one meal most schedules can share.',
        'Cafés stretch breakfast into an all-day ritual for meeting across schedules.'
      ]
    };
    const initialState = () => ({
      stage: 0,
      error: '',
      email: '',
      code: '',
      nickname: '',
      adult: false,
      terms: false,
      permanent: false,
      answer: '',
      step1: '',
      step2: '',
      step3: '',
      convincing: '',
      entertaining: ''
    });
    const stateByVariant = { A: initialState(), B: initialState(), C: initialState() };
    const queryVariant = new URLSearchParams(location.search).get('variant')?.toUpperCase();
    let variant = variants.some(item => item.key === queryVariant) ? queryVariant : 'A';

    const esc = value => String(value ?? '').replace(/[&<>'"]/g, char => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'
    })[char]);
    const current = () => stateByVariant[variant];
    const responseComplete = state => [state.answer, state.step1, state.step2, state.step3].every(value => value.trim());
    const accountComplete = state => state.email.includes('@') && /^\d{6}$/.test(state.code) && state.nickname.trim().length >= 3 && state.adult && state.terms && state.permanent;
    const ballotComplete = state => Boolean(state.convincing || state.entertaining);

    function topbar(className = '') {
      return `<header class="topbar ${className}">
        <div class="brand"><span class="brand-mark">✦</span> ONE FACT CHANGED</div>
        <div class="prototype-flag">PROTOTYPE · NO PERSISTENCE</div>
      </header>`;
    }

    function stageLine(labels, active) {
      return `<div class="stage-line" aria-label="Onboarding progress">${labels.map((label, index) =>
        `<span class="stage-chip ${index < active ? 'done' : ''} ${index === active ? 'current' : ''}">${index + 1}. ${label}</span>${index < labels.length - 1 ? '<span class="stage-arrow">→</span>' : ''}`
      ).join('')}</div>`;
    }

    function accountForm(state, id) {
      return `<form class="account-form" data-form="account" novalidate>
        <div class="form-grid two">
          <label class="field"><span>Email</span><input type="email" autocomplete="email" data-field="email" value="${esc(state.email)}" placeholder="you@example.com"><span class="field-hint">Every sign-in uses a fresh email code.</span></label>
          <label class="field"><span>Six-digit email code</span><input inputmode="numeric" autocomplete="one-time-code" maxlength="6" data-field="code" value="${esc(state.code)}" placeholder="123456"><span class="field-hint">Prototype accepts any six digits.</span></label>
        </div>
        <div class="checks">
          <label class="check"><input type="checkbox" data-field="adult" ${state.adult ? 'checked' : ''}><span>I confirm I am at least 18.</span></label>
          <label class="check"><input type="checkbox" data-field="terms" ${state.terms ? 'checked' : ''}><span>I accept the terms and content policy.</span></label>
        </div>
        <label class="field permanent"><span>Choose your permanent Nickname</span><input autocomplete="nickname" data-field="nickname" value="${esc(state.nickname)}" placeholder="Moss Satellite"><span class="field-hint">Public, globally unique, and not renameable.</span></label>
        <label class="check"><input type="checkbox" data-field="permanent" ${state.permanent ? 'checked' : ''}><span>I understand <strong>${esc(state.nickname || 'this Nickname')}</strong> is permanent.</span></label>
        ${state.error ? `<p class="error" role="alert">${esc(state.error)}</p>` : ''}
        <div class="button-row">
          <button class="button primary" type="submit" data-account-submit="${id}">Create account</button>
          <button class="text-button" type="button" data-fill-account>Fill prototype details</button>
        </div>
      </form>`;
    }

    function responseFields(state, mode = 'cards') {
      if (mode === 'stack') {
        return `<form class="response-form" data-form="response" novalidate>
          <label class="field answer-field"><span>Answer first: what changes in everyday life?</span><textarea data-field="answer" placeholder="State one concise consequence…">${esc(state.answer)}</textarea></label>
          <div class="b-inline-chain">
            <div class="b-step-stack">
              ${[1,2,3].map(number => `<label class="b-step-row"><span class="b-step-num">${number}</span><textarea data-field="step${number}" aria-label="Causal step ${number}" placeholder="${number === 1 ? 'What changes first?' : number === 2 ? 'What follows from that?' : 'What makes the answer happen?'}">${esc(state[`step${number}`])}</textarea></label>`).join('')}
            </div>
            <div class="b-arrow-column">→</div>
          </div>
          ${state.error ? `<p class="error" role="alert">${esc(state.error)}</p>` : ''}
          <div class="button-row"><button class="button primary" type="submit" data-response-submit>Finish draft</button><button class="text-button" type="button" data-fill-response>Use a worked example</button></div>
        </form>`;
      }
      return `<form class="response-form" data-form="response" novalidate>
        <label class="field answer-field"><span>Your answer</span><textarea data-field="answer" placeholder="State one concise consequence…">${esc(state.answer)}</textarea><span class="field-hint">Readers see this first. The three steps below must earn it.</span></label>
        <div class="steps">
          ${[1,2,3].map(number => `<label class="step-card field"><span>Step ${number}</span><textarea data-field="step${number}" placeholder="${number === 1 ? 'What changes first?' : number === 2 ? 'Then what follows?' : 'How does that produce the answer?'}">${esc(state[`step${number}`])}</textarea></label>`).join('')}
        </div>
        ${state.error ? `<p class="error" role="alert">${esc(state.error)}</p>` : ''}
        <div class="button-row"><button class="button primary" type="submit" data-response-submit>Review response</button><button class="text-button" type="button" data-fill-response>Use a worked example</button></div>
      </form>`;
    }

    function responsePreview(state) {
      return `<div class="chain-preview" aria-label="Response causal chain">
        <article class="chain-node"><span class="chain-label">PREMISE</span>${esc(example.premise)}</article>
        <article class="chain-node"><span class="chain-label">STEP 1</span>${esc(state.step1)}</article>
        <article class="chain-node"><span class="chain-label">STEP 2</span>${esc(state.step2)}</article>
        <article class="chain-node"><span class="chain-label">STEP 3</span>${esc(state.step3)}</article>
        <article class="chain-node"><span class="chain-label">ANSWER</span><strong>${esc(state.answer)}</strong></article>
      </div>`;
    }

    function ballot(state, destination) {
      const option = (dimension, value, label) => `<button type="button" class="rate ${state[dimension] === value ? 'selected' : ''}" data-rate="${dimension}" data-value="${value}" aria-pressed="${state[dimension] === value}">${label}</button>`;
      return `<section class="panel ballot">
        <article class="peer-response"><span class="panel-number">A RESPONSE BY ${peer.author.toUpperCase()}</span><h2>${peer.answer}</h2><div class="peer-chain">${peer.steps.map((step, index) => `<div class="peer-step"><strong>${index + 1}.</strong> ${step}</div>`).join('')}</div></article>
        <div class="ratings">
          <section class="rating"><h3>Convincing?</h3><p>Accepting the premise, could you follow the explanation, and did the answer feel earned?</p><div class="rating-options">${option('convincing','yes','Yes')}${option('convincing','no','No')}${option('convincing','abstain','Abstain')}</div><p>Current public total: 11 yes · 2 no · 85%</p></section>
          <section class="rating"><h3>Entertaining?</h3><p>Did it hold your attention or give you a reaction worth rewarding?</p><div class="rating-options">${option('entertaining','yes','Yes')}${option('entertaining','no','No')}${option('entertaining','abstain','Abstain')}</div><p>Current public total: 9 yes · 4 no · 69%</p></section>
        </div>
        <footer class="ballot-footer"><p class="mini-note">Your ballot is private and final. Choose at least one explicit Yes or No; you may abstain on the other dimension.</p>${state.error ? `<p class="error" role="alert">${esc(state.error)}</p>` : ''}<div class="button-row"><button class="button primary" type="button" data-save-ballot="${destination}">Save ballot</button></div></footer>
      </section>`;
    }

    function board(state, message = 'Your first ballot is saved.') {
      return `<section>
        <p class="callout success"><strong>${esc(message)}</strong> The wider board is now open for free exploration.</p>
        <div class="board-mini">
          <article class="board-card"><span class="panel-number">CLOSING IN 2 DAYS</span><strong>${esc(example.premise)}</strong><span class="mini-note">28 responses · 214 ballots</span></article>
          <article class="board-card"><span class="panel-number">NEW TODAY</span><strong>What if plants could remember being touched?</strong><span class="mini-note">7 responses · 31 ballots</span></article>
          <article class="board-card"><span class="panel-number">OPEN LAB</span><strong>What if shadows pointed toward home?</strong><span class="mini-note">Results frozen · still playable</span></article>
        </div>
        <div class="result-list">
          <div class="result-row"><strong>1</strong><span><strong>${peer.answer}</strong><br><span class="mini-note">${peer.author} · Convincing 85% · Entertaining 69%</span></span><strong>LIVE</strong></div>
          <div class="result-row you"><strong>—</strong><span><strong>${esc(state.answer)}</strong><br><span class="mini-note">${esc(state.nickname || 'Your Nickname')} · Needs 5 ratings</span></span><strong>YOU</strong></div>
          <div class="result-row"><strong>2</strong><span><strong>Night buses would become moving neighborhood cafés.</strong><br><span class="mini-note">Theo Alvarez · Convincing 77% · Entertaining 82%</span></span><strong>LIVE</strong></div>
        </div>
      </section>`;
    }

    function variantA() {
      const state = current();
      const labels = ['Learn', 'Nickname', 'Premise', 'Respond', 'Review', 'Judge', 'Board'];
      let content = '';
      if (state.stage === 0) {
        content = `<h1 class="hero-title">CHANGE ONE FACT.<br>TRACE WHAT FOLLOWS.</h1><p class="hero-copy">Make one answer, connect it with exactly three causal steps, then judge another player on two separate qualities.</p>
          <div class="a-intro-strip">
            <article class="a-intro-panel"><span class="panel-number">PANEL 01</span><strong>Accept the premise.</strong><span class="mini-note">The strange fact is true for this round.</span></article>
            <article class="a-intro-panel"><span class="panel-number">PANEL 02</span><strong>Follow the first effect.</strong><span class="mini-note">No expert knowledge required.</span></article>
            <article class="a-intro-panel"><span class="panel-number">PANEL 03</span><strong>Keep the chain moving.</strong><span class="mini-note">Each step follows the last.</span></article>
            <article class="a-intro-panel"><span class="panel-number">PANEL 04</span><strong>Land one answer.</strong><span class="mini-note">Surprising or serious both work.</span></article>
            <article class="a-intro-panel"><span class="panel-number">PANEL 05</span><strong>Judge a peer.</strong><span class="mini-note">Convincing and Entertaining stay separate.</span></article>
          </div>
          <p class="callout"><strong>Guided-strip hypothesis:</strong> teach the whole loop first, register next, and reveal the live board only after one ballot.</p>
          <div class="button-row"><button class="button primary" type="button" data-go="1">Start the guided round</button></div>`;
      } else if (state.stage === 1) {
        content = `<div class="a-grid"><section class="panel panel-pad"><span class="panel-number">MAKE YOUR LAB NOTEBOOK</span><h1 class="heavy">One public name.<br>No profile upkeep.</h1><p>Your Nickname signs every premise and response. It cannot be changed later.</p>${accountForm(state, 'A')}</section><aside class="a-aside"><h3>What becomes public?</h3><ul><li>Your permanent Nickname</li><li>Approved Premises</li><li>Published Responses</li><li>Recognition marks</li></ul><p class="mini-note">Your email, ballots, drafts, and reports stay private.</p></aside></div>`;
      } else if (state.stage === 2) {
        content = `<section class="premise-card"><span class="deadline">LIVE ROUND · 5 DAYS LEFT</span><span class="panel-number">TODAY'S SIMPLE START</span><h2>${example.premise}</h2></section><div class="a-grid"><div><h2 class="heavy">Treat it as true.</h2><p>Do not argue with the premise. Follow one effect into the next until a concrete everyday consequence appears.</p><div class="button-row"><button class="button primary" type="button" data-go="3">Write a response</button></div></div><aside class="a-aside"><h3>Your one-round limit</h3><p>Publish one response. It becomes immutable immediately, so you review the whole chain before publishing.</p></aside></div>`;
      } else if (state.stage === 3) {
        content = `<section class="premise-card"><span class="panel-number">PREMISE</span><h2>${example.premise}</h2></section><div class="panel panel-pad" style="margin-top:20px"><h2 class="heavy">Answer first. Earn it in three steps.</h2>${responseFields(state)}</div>`;
      } else if (state.stage === 4) {
        content = `<h1 class="hero-title" style="font-size:clamp(40px,7vw,82px)">READ THE CHAIN<br>FORWARD.</h1>${responsePreview(state)}<p class="callout" style="margin-top:24px"><strong>Publishing locks this response.</strong> You may later withdraw it, but cannot edit it.</p><div class="button-row"><button class="button primary" type="button" data-go="5">Publish and judge a peer</button><button class="button" type="button" data-go="3">Revise draft</button></div>`;
      } else if (state.stage === 5) {
        content = `<h1 class="hero-title" style="font-size:clamp(40px,7vw,82px)">NOW READ<br>ONE OTHER CHAIN.</h1><p class="hero-copy">Your response is live. Your first private ballot teaches how this round decides its separate Convincing and Entertaining results.</p>${ballot(state, 6)}`;
      } else {
        content = `<h1 class="hero-title" style="font-size:clamp(40px,7vw,82px)">THE BOARD<br>OPENS UP.</h1>${board(state)}`;
      }
      return `<div class="shell">${topbar()}${stageLine(labels, Math.min(state.stage, labels.length - 1))}${content}</div>`;
    }

    function variantB() {
      const state = current();
      let content = '';
      if (state.stage === 0) {
        content = `<div class="b-workspace"><aside class="b-premise"><span class="panel-number">LIVE PREMISE · 5 DAYS LEFT</span><h1>${example.premise}</h1><p>No tour first. Treat it as true and follow one effect into the next.</p><p class="b-header-note">No account yet · this draft stays in this tab</p></aside><section class="b-draft"><div class="b-draft-head"><div><span class="panel-number">YOUR RESPONSE</span><h2>Lead with the answer.</h2></div><button class="button small" type="button" data-fill-response>Use example</button></div>${responseFields(state, 'stack')}</section></div><p class="callout" style="margin-top:22px"><strong>Cold-open hypothesis:</strong> let the premise and fields teach the game; ask for an account only after the player has a response worth keeping.</p>`;
      } else if (state.stage === 1) {
        content = `<div class="b-gate"><section class="b-gate-copy"><span class="panel-number" style="color:var(--yellow)">DRAFT COMPLETE</span><h1>KEEP IT.<br>NAME IT.</h1><p>Your draft exists only in this tab. Create the permanent Nickname that will sign it before review.</p></section><section class="panel panel-pad"><h2 class="heavy">Create your Account</h2>${accountForm(state, 'B')}</section></div>`;
      } else if (state.stage === 2) {
        content = `<h1 class="hero-title" style="font-size:clamp(40px,7vw,82px)">ONE LAST LOOK.<br>THEN IT IS LIVE.</h1>${responsePreview(state)}<p class="callout" style="margin-top:22px"><strong>Signed by ${esc(state.nickname)}.</strong> Publishing locks the words and starts rating immediately.</p><div class="button-row"><button class="button primary" type="button" data-go="3">Publish response</button><button class="button" type="button" data-go="0">Revise draft</button></div>`;
      } else if (state.stage === 3) {
        content = `<h1 class="hero-title" style="font-size:clamp(40px,7vw,82px)">YOU ARE ON<br>THE LIVE BOARD.</h1><p class="hero-copy">The broader board appears now. One nearby response is lifted into a private first ballot before free exploration.</p><div class="b-board-stage"><div class="b-board-muted" aria-hidden="true">${board(state, 'Your response is published.')}</div><div class="b-ballot-float">${ballot(state, 4)}</div></div>`;
      } else {
        content = `<h1 class="hero-title" style="font-size:clamp(40px,7vw,82px)">DRAFT. NAME.<br>PUBLISH. JUDGE.</h1>${board(state, 'Ballot saved. Your first loop is complete.')}`;
      }
      return `<div class="shell b-shell">${topbar()}<div class="stage-line"><span class="stage-chip current">Cold open · ${state.stage === 0 ? 'drafting before signup' : state.stage === 1 ? 'account gate' : state.stage === 2 ? 'publication review' : state.stage === 3 ? 'board plus ballot' : 'free board'}</span></div>${content}</div>`;
    }

    function liveBoard(state, final = false) {
      return `<section class="c-board"><header class="c-board-head"><div><span class="panel-number" style="color:#173c3a">LIVE ROUNDS</span><h1>${final ? 'YOUR BOARD NOW.' : 'PICK A WORLD.'}</h1></div><p class="mini-note">Every approved premise opens its own seven-day round.<br>Responses and totals are public immediately.</p></header><div class="c-rounds">
        <article class="c-round featured"><span class="deadline">EASY START · 5 DAYS LEFT</span><h2>${example.premise}</h2><div class="c-stats"><span class="stat">28 responses</span><span class="stat">214 ballots</span></div>${final ? `<p class="callout success" style="margin-top:18px"><strong>${esc(state.nickname)} joined this round.</strong></p>` : `<div class="button-row"><button class="button primary" type="button" data-go="1">Choose this premise</button></div>`}</article>
        <article class="c-round"><span class="panel-number">NEW · 6 DAYS LEFT</span><h2>What if plants could remember being touched?</h2><div class="c-stats"><span class="stat">7 responses</span><span class="stat">31 ballots</span></div></article>
        <article class="c-round"><span class="panel-number">CLOSING SOON · 8 HOURS</span><h2>What if every lie changed the weather?</h2><div class="c-stats"><span class="stat">46 responses</span><span class="stat">503 ballots</span></div></article>
      </div></section>`;
    }

    function cRail(stage) {
      const labels = ['Nickname', 'Response', 'Publish', 'Judge'];
      return `<nav class="c-rail" aria-label="First round steps">${labels.map((label,index) => `<span class="c-rail-item ${stage === index + 1 ? 'active' : ''}">${index + 1}. ${label}</span>`).join('')}</nav>`;
    }

    function variantC() {
      const state = current();
      let content = '';
      if (state.stage === 0) {
        content = `${liveBoard(state)}<p class="callout" style="margin-top:23px"><strong>Board-doorway hypothesis:</strong> reveal the real game immediately; onboarding is a marked easy path through one live round, not a separate tour.</p>`;
      } else if (state.stage === 1) {
        content = `<div class="c-flow">${cRail(state.stage)}<section class="c-main"><section class="premise-card"><span class="panel-number">YOU CHOSE</span><h2>${example.premise}</h2></section><section class="panel panel-pad" style="margin-top:18px"><h2 class="heavy">Sign the work before you make it.</h2><p>The board stays visible in the navigation; this Account step makes your public Lab Notebook.</p>${accountForm(state, 'C')}</section></section></div>`;
      } else if (state.stage === 2) {
        content = `<div class="c-flow">${cRail(state.stage)}<section class="c-main"><section class="premise-card"><span class="panel-number">LIVE PREMISE</span><h2>${example.premise}</h2></section><section class="panel panel-pad" style="margin-top:18px"><h2 class="heavy">Build one causal path.</h2>${responseFields(state)}</section></section></div>`;
      } else if (state.stage === 3) {
        content = `<div class="c-flow">${cRail(state.stage)}<section class="c-main"><h1 class="hero-title" style="font-size:clamp(38px,6vw,74px)">DOES EACH PANEL<br>PUSH THE NEXT?</h1>${responsePreview(state)}<p class="callout" style="margin-top:20px"><strong>Immutable when published.</strong> Review now; rating starts immediately.</p><div class="button-row"><button class="button primary" type="button" data-go="4">Publish response</button><button class="button" type="button" data-go="2">Revise</button></div></section></div>`;
      } else if (state.stage === 4) {
        content = `<div class="c-flow">${cRail(state.stage)}<section class="c-main"><h1 class="hero-title" style="font-size:clamp(38px,6vw,74px)">RATE ONE NEIGHBOR<br>ON THE BOARD.</h1>${ballot(state, 5)}</section></div>`;
      } else {
        content = `${liveBoard(state, true)}<div style="margin-top:22px">${board(state, 'Ballot saved. You are back where you began, now as a participant.')}</div>`;
      }
      return `<div class="shell">${topbar('c-topbar')}${content}</div>`;
    }

    function render() {
      const app = document.querySelector('#app');
      app.innerHTML = variant === 'A' ? variantA() : variant === 'B' ? variantB() : variantC();
      const info = variants.find(item => item.key === variant);
      document.querySelector('#switcher-label').textContent = `${info.key} · ${info.name}`;
      const state = current();
      document.querySelector('#state-readout').textContent = `STATE · variant=${variant} · stage=${state.stage} · account=${accountComplete(state) ? 'ready' : 'open'} · response=${responseComplete(state) ? 'complete' : 'open'} · ballot=${ballotComplete(state) ? 'marked' : 'open'}\nPrototype loaded. No persistence.`;
      window.scrollTo({ top: 0, behavior: 'instant' });
    }

    function setStage(stage) {
      const state = current();
      state.stage = Number(stage);
      state.error = '';
      render();
    }

    function fillAccount() {
      const state = current();
      state.email = 'player@example.com';
      state.code = '314159';
      state.nickname = 'Moss Satellite';
      state.adult = true;
      state.terms = true;
      state.permanent = true;
      state.error = '';
      render();
    }

    function fillResponse() {
      const state = current();
      state.answer = example.answer;
      [state.step1, state.step2, state.step3] = example.steps;
      state.error = '';
      render();
    }

    document.addEventListener('input', event => {
      const field = event.target.dataset.field;
      if (!field) return;
      current()[field] = event.target.type === 'checkbox' ? event.target.checked : event.target.value;
      document.querySelector('#state-readout').textContent = `STATE · variant=${variant} · stage=${current().stage} · account=${accountComplete(current()) ? 'ready' : 'open'} · response=${responseComplete(current()) ? 'complete' : 'open'} · ballot=${ballotComplete(current()) ? 'marked' : 'open'}\nPrototype loaded. No persistence.`;
    });

    document.addEventListener('change', event => {
      const field = event.target.dataset.field;
      if (!field || event.target.type !== 'checkbox') return;
      current()[field] = event.target.checked;
    });

    document.addEventListener('submit', event => {
      event.preventDefault();
      const state = current();
      if (event.target.dataset.form === 'account') {
        if (!accountComplete(state)) {
          state.error = 'Enter an email, any six digits, a Nickname of at least three characters, and confirm all three promises.';
          render();
          return;
        }
        setStage(variant === 'A' ? 2 : variant === 'B' ? 2 : 2);
      }
      if (event.target.dataset.form === 'response') {
        if (!responseComplete(state)) {
          state.error = 'Complete the answer and all three causal steps before continuing.';
          render();
          return;
        }
        setStage(variant === 'A' ? 4 : variant === 'B' ? 1 : 3);
      }
    });

    document.addEventListener('click', event => {
      const button = event.target.closest('button');
      if (!button) return;
      if (button.dataset.go !== undefined) setStage(button.dataset.go);
      if (button.hasAttribute('data-fill-account')) fillAccount();
      if (button.hasAttribute('data-fill-response')) fillResponse();
      if (button.dataset.rate) {
        current()[button.dataset.rate] = button.dataset.value;
        current().error = '';
        render();
      }
      if (button.dataset.saveBallot !== undefined) {
        const state = current();
        const explicit = ['yes', 'no'].includes(state.convincing) || ['yes', 'no'].includes(state.entertaining);
        if (!explicit) {
          state.error = 'Choose Yes or No on at least one dimension. Abstain alone is not a ballot.';
          render();
          return;
        }
        setStage(button.dataset.saveBallot);
      }
      if (button.dataset.variantStep) {
        const index = variants.findIndex(item => item.key === variant);
        const next = (index + Number(button.dataset.variantStep) + variants.length) % variants.length;
        variant = variants[next].key;
        const url = new URL(location.href);
        url.searchParams.set('variant', variant);
        history.replaceState({}, '', url);
        render();
      }
    });

    document.addEventListener('keydown', event => {
      if (!['ArrowLeft','ArrowRight'].includes(event.key)) return;
      if (event.target.matches('input, textarea, [contenteditable]')) return;
      const step = event.key === 'ArrowLeft' ? -1 : 1;
      const index = variants.findIndex(item => item.key === variant);
      variant = variants[(index + step + variants.length) % variants.length].key;
      const url = new URL(location.href);
      url.searchParams.set('variant', variant);
      history.replaceState({}, '', url);
      render();
    });

    window.addEventListener('popstate', () => {
      const next = new URLSearchParams(location.search).get('variant')?.toUpperCase();
      if (variants.some(item => item.key === next)) variant = next;
      render();
    });

    render();
  </script>
</body>
</html>
